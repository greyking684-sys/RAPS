<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle industrial rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Industrial Rig / Factory Silhouettes & Gauge Ring -->
  <g transform="translate(256, 230)">
    <!-- OEE Gauge Arc -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="24" 
            stroke-dasharray="660" stroke-dashoffset="180" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#greenGrad)" stroke-width="24" 
            stroke-dasharray="660" stroke-dashoffset="520" stroke-linecap="round"/>

    <!-- Central Factory & Precision Tower -->
    <!-- Factory Body -->
    <path d="M-60 70 L-60 -10 L-25 15 L-25 -25 L10 0 L10 -55 L45 -30 L45 70 Z" 
          fill="url(#blueGrad)" opacity="0.95"/>
    <!-- Factory Windows -->
    <rect x="-48" y="15" width="12" height="16" rx="2" fill="#93c5fd"/>
    <rect x="-48" y="40" width="12" height="16" rx="2" fill="#93c5fd"/>
    <rect x="-12" y="15" width="12" height="16" rx="2" fill="#93c5fd"/>
    <rect x="-12" y="40" width="12" height="16" rx="2" fill="#93c5fd"/>
    <rect x="22" y="-10" width="12" height="16" rx="2" fill="#93c5fd"/>
    <rect x="22" y="15" width="12" height="16" rx="2" fill="#93c5fd"/>
    <rect x="22" y="40" width="12" height="16" rx="2" fill="#93c5fd"/>

    <!-- Industrial Rig Derrick / Crane Lines on Right -->
    <path d="M-90 70 L90 70" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Real-time Production Pulse Dot -->
    <circle cx="108" cy="-88" r="14" fill="#10b981" filter="url(#glow)"/>
    <circle cx="108" cy="-88" r="7" fill="#ffffff"/>
  </g>

  <!-- Rig & Plant Services Badge Text / Label -->
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">RIG &amp; PLANT</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" font-size="24" fill="#38bdf8" letter-spacing="6">OEE PLATFORM</text>
</svg>
